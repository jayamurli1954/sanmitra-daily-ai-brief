name: Cloud Prompt Video Production & YouTube Upload

on:
  push:
    branches:
      - main
    paths:
      - 'prompts/**'
      - 'src/aibrief/data/active_episode.json'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      prompt_file:
        description: 'Prompt Markdown File Path (leave empty if active_episode.json is already committed)'
        required: false
        default: ''
        type: string

jobs:
  produce-and-publish:
    name: Cloud Production (Headless Remotion + YouTube Upload)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia & Font Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Configure Cloud Authentication Secrets
        env:
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            echo "[+] Restored token.json from GitHub Secrets"
          fi
          if [ -n "$GDRIVE_TOKEN_JSON" ]; then
            echo "$GDRIVE_TOKEN_JSON" > gdrive_token.json
            echo "[+] Restored gdrive_token.json from GitHub Secrets"
          fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then
            echo "$CLIENT_SECRET_JSON" > client_secret.json
            echo "[+] Restored client_secret.json from GitHub Secrets"
          fi

      - name: Produce Video from Prompt & Upload Directly to YouTube
        env:
          PRIVACY_SETTING: ${{ github.event.inputs.privacy || 'private' }}
          PROMPT_FILE: ${{ github.event.inputs.prompt_file }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          PROMPT_ARG=""
          if [ -n "$PROMPT_FILE" ] && [ -f "$PROMPT_FILE" ]; then
            PROMPT_ARG="--prompt-file $PROMPT_FILE"
          elif [ -f "prompts/daily_prompt.md" ]; then
            PROMPT_ARG="--prompt-file prompts/daily_prompt.md"
          fi
          
          python produce_from_prompt.py $PROMPT_ARG --privacy "$PRIVACY_SETTING"

      - name: Upload Daily Broadcast Deliverables (Video, Thumbnails, Posts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibrief-deliverables-${{ github.sha }}
          path: |
            out/aibrief/*.mp4
            out/aibrief/*.png
            out/aibrief/*.srt
            out/aibrief/*.txt
          retention-days: 14

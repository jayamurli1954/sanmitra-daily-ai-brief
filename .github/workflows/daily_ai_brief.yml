name: Daily Autonomous SanMitra AI News Wire

on:
  schedule:
    # 00:00 UTC is 05:30 AM IST (Runs early so video & LinkedIn dispatches are ready by 6:15 AM)
    - cron: '00 00 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  produce-and-publish:
    name: Autonomous Multi-Agent Broadcast Pipeline
    runs-on: ubuntu-latest
    # Render alone took ~15 min on 2026-10-10; runs were cancelled at the old 30/40 min limits.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install imagehash PyWavelets

      - name: Run Fact-Check and Gate Tests
        run: python -m unittest discover -s tests -v

      - name: Configure Cloud Authentication Secrets
        env:
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            echo "[+] Restored token.json from GitHub Secrets"
          fi
          if [ -n "$GDRIVE_TOKEN_JSON" ]; then
            echo "$GDRIVE_TOKEN_JSON" > gdrive_token.json
            echo "[+] Restored gdrive_token.json from GitHub Secrets"
          fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then
            echo "$CLIENT_SECRET_JSON" > client_secret.json
            echo "[+] Restored client_secret.json from GitHub Secrets"
          fi

      - name: Run Autonomous Multi-Agent Broadcast Production & YouTube Upload
        env:
          PRIVACY_SETTING: ${{ github.event.inputs.privacy || 'private' }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python run_autonomous_brief.py --privacy "$PRIVACY_SETTING"

      # The run updates the 14-day visual memory, the story ledger and (if the
      # crew drafted it) today's prompt. Without this commit the next run forgets
      # them and the no-repeat rules cannot work.
      - name: Commit Episode Memory Back to the Repository
        if: always()
        run: |
          git config user.name "SanMitra Intelligence Bot"
          git config user.email "bot@sanmitratech.com"
          git add prompts/ src/aibrief/data/visual_memory.json src/aibrief/data/story_memory_ledger.json || true
          if git diff --staged --quiet; then
            echo "[*] No memory changes to commit."
          else
            git commit -m "Auto: episode memory for $(TZ=Asia/Kolkata date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main && git push origin main
          fi

      # The repository is public, so artifacts are downloadable by anyone signed
      # in to GitHub. The MP4 is deliberately NOT uploaded: the video stays
      # private on YouTube until it is reviewed.
      - name: Upload QA Summary, Thumbnails and Posts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibrief-deliverables-${{ github.sha }}
          path: |
            out/aibrief/*.png
            out/aibrief/*.srt
            out/aibrief/*.txt
            out/aibrief/*.md
          retention-days: 7

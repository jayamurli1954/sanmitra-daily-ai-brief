name: Cloud Autonomous Production (Primary Broadcaster)

# Primary daily production runs automatically in GitHub Actions at 7:00 PM IST (13:30 UTC).
# When this run starts it pushes an empty "episode claim <date> by cloud" commit.
# The local PC checks for this claim and yields so duplicate videos are never produced.
on:
  schedule:
    # Meant for 19:00 IST (13:30 UTC), but GitHub starts this repository's scheduled
    # runs 7 to 9 hours late (Nov 2026: the 13:30 UTC cron fired at 01:30-04:40 IST).
    # So several earlier times are scheduled: whichever one actually starts inside the
    # 18:30-23:59 IST window claims and produces the episode, and the claim makes every
    # later one stop at the first step. Runs that start in the daytime do nothing.
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '30 12 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target production date (YYYY-MM-DD), leave blank for auto'
        type: string
        default: ''
      dry_run:
        description: 'Build and render but do not upload, claim or commit (for testing)'
        type: boolean
        default: true
      force:
        description: 'Produce even if today''s episode is already claimed'
        type: boolean
        default: false

concurrency:
  group: cloud-fallback
  cancel-in-progress: false

jobs:
  fallback:
    name: Produce today's episode in the cloud
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Has today's episode been claimed?
        id: claim
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TODAY="${{ inputs.date }}"
            echo "[*] Explicit target date provided via workflow_dispatch: $TODAY"
            echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
            echo "today=$TODAY" >> "$GITHUB_OUTPUT"
            # GitHub Actions scheduled cron can be delayed by several hours during peak times.
            # Allow runs from 18:30 IST through late night. If running past midnight (00:00-05:00 IST),
            # check if yesterday's episode was missed due to GitHub cron queuing delay or claim release.
            NOW=$(TZ=Asia/Kolkata date +%H%M)
            if [ "${{ github.event_name }}" = "schedule" ] && { [ "$NOW" -ge 0500 ] && [ "$NOW" -lt 1830 ]; }; then
              echo "[*] Scheduled run started at $NOW IST (daytime outside 18:30-05:00 IST). Doing nothing."
              echo "produce=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$NOW" -ge 0000 ] && [ "$NOW" -lt 0500 ]; then
              # After midnight a run may only catch up last evening's missed episode.
              # It must never start the new day's: at 4 AM there is no news yet (27 Nov:
              # 1 story of the 10 needed), and its failed claim churns the history.
              YESTERDAY=$(TZ=Asia/Kolkata date -d "yesterday" +%Y-%m-%d)
              if [ -f "src/aibrief/data/aired/$YESTERDAY.json" ]; then
                echo "[*] $NOW IST: $YESTERDAY has aired and it is too early for $TODAY. Doing nothing."
                echo "produce=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "[*] Detected unaired episode for $YESTERDAY past midnight ($NOW IST). Producing missed episode for $YESTERDAY."
              TODAY="$YESTERDAY"
              echo "today=$TODAY" > "$GITHUB_OUTPUT"
            fi
          fi
          if [ -f "src/aibrief/data/aired/$TODAY.json" ] && [ "$FORCE" != "true" ]; then
            echo "[*] $TODAY has already aired. Nothing to do."
            echo "produce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Claims and releases are empty commits listed newest first, so the first
          # match is the current holder. A release frees the date only until someone
          # claims it again: on 23 Nov a midnight cloud claim + release for the date
          # made the old check ignore the PC's later claim.
          LAST=$(git log -200 --format=%s | grep -E "episode (claim|release) $TODAY by " | head -1 || true)
          echo "[*] Latest claim or release for $TODAY: ${LAST:-none}"
          case "$LAST" in
            *"episode claim $TODAY by"*)
              if [ "$FORCE" != "true" ]; then
                echo "[*] Claimed: $LAST. Nothing to do."
                echo "produce=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac
          echo "[!] $TODAY is not claimed (or forced): producing in the cloud."
          echo "produce=true" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != "true" ]; then
            git config user.name "SanMitra Intelligence Bot"
            git config user.email "bot@sanmitratech.com"
            git commit --allow-empty -m "Auto: episode claim $TODAY by cloud [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Node.js 20
        if: steps.claim.outputs.produce == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        if: steps.claim.outputs.produce == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia Libraries
        if: steps.claim.outputs.produce == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core

      - name: Install Dependencies
        if: steps.claim.outputs.produce == 'true'
        run: |
          npm ci
          pip install -r requirements.txt
          pip install imagehash PyWavelets

      - name: Run Fact-Check and Gate Tests
        if: steps.claim.outputs.produce == 'true'
        run: python -m unittest discover -s tests -v

      - name: Configure Cloud Authentication Secrets
        if: steps.claim.outputs.produce == 'true'
        env:
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then echo "$TOKEN_JSON" > token.json; fi
          if [ -n "$GDRIVE_TOKEN_JSON" ]; then echo "$GDRIVE_TOKEN_JSON" > gdrive_token.json; fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then echo "$CLIENT_SECRET_JSON" > client_secret.json; fi

      # Same order as run_nightly_production.bat: editor brief, then Sunday's
      # round-up or the day's collection, then build, voice, render and upload.
      - name: Collect, Build, Render and Upload
        if: steps.claim.outputs.produce == 'true'
        env:
          TODAY: ${{ steps.claim.outputs.today }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # The runner has no Claude Code sign-in, so the story rewrite is billed to this key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python adopt_editor_brief.py --date "$TODAY"
          if [ "$(date -d "$TODAY" +%A)" = "Sunday" ]; then
            python weekly_roundup.py --date "$TODAY" || true
          fi
          if [ ! -f "prompts/$TODAY.md" ]; then
            python nightly_brief_collector.py --date "$TODAY" --no-git --no-gdrive || echo "[!] Collector failed; the build tops up from the live harvest."
          fi

          if [ "$DRY_RUN" = "true" ]; then
            python run_autonomous_brief.py --date "$TODAY" --no-upload
            exit 0
          fi

          # 21:30 IST if there is still time to set it, otherwise 23:59 IST. An upload
          # that finishes after the chosen time is published by YouTube on arrival.
          NOW=$(TZ=Asia/Kolkata date +%H%M)
          WALL_DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          if [ "$TODAY" = "$WALL_DATE" ]; then
            if [ "$NOW" -lt 2125 ]; then PUBLISH_AT=21:30; else PUBLISH_AT=23:59; fi
            python run_autonomous_brief.py --date "$TODAY" --privacy private --publish-at-ist "$PUBLISH_AT"
          else
            # Back-producing a missed episode from yesterday: upload directly without a future schedule
            python run_autonomous_brief.py --date "$TODAY" --privacy private
          fi

      # Without this the next run (PC or cloud) forgets the 14-day visual memory
      # and the story ledger, and the no-repeat rules cannot work.
      # Only after a successful run: a failed run's half-written memory must not
      # replace the real 14-day visual memory (it did on 15 Nov 2026).
      - name: Commit Episode Memory Back to the Repository
        if: success() && steps.claim.outputs.produce == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "SanMitra Intelligence Bot"
          git config user.email "bot@sanmitratech.com"
          git add prompts/ src/aibrief/data/aired/ src/aibrief/data/visual_memory.json src/aibrief/data/story_memory_ledger.json || true
          if git diff --staged --quiet; then
            echo "[*] No memory changes to commit."
          else
            git commit -m "Auto: episode memory for ${{ steps.claim.outputs.today }} (cloud autonomous) [skip ci]"
            git stash --quiet || true
            git pull --rebase origin main && git push origin HEAD:main
          fi

      # A cloud run that claimed the episode and then failed hands it back, so a
      # PC that wakes later still produces it (run_nightly_production.bat checks).
      - name: Release the Claim if the Cloud Run Failed
        if: failure() && steps.claim.outputs.produce == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "SanMitra Intelligence Bot"
          git config user.email "bot@sanmitratech.com"
          git stash --include-untracked --quiet || true
          git commit --allow-empty -m "Auto: episode release ${{ steps.claim.outputs.today }} by cloud [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main

      # The repository is public: the MP4 is deliberately NOT uploaded as an artifact.
      - name: Upload QA Summary, Thumbnails and Posts
        if: steps.claim.outputs.produce == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-fallback-${{ steps.claim.outputs.today }}
          path: |
            out/aibrief/*.png
            out/aibrief/*.srt
            out/aibrief/*.txt
            out/aibrief/*.md
          retention-days: 7
